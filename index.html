<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theo dõi thưởng Q4.2026 - Phòng Be.E</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F8FC; --panel:#FFFFFF; --ink:#1A1F2C; --ink2:#4A5468; --ink3:#7B869C;
  --line:#DCE6F2; --soft:#E6EFF9; --blue:#1E88E5; --blue-d:#0052A7; --navy:#1B2B55;
  --gold:#FFD24D; --green:#1DBA5F; --red:#C93B3B; --amber:#9A6A0A;
  --lv-j:#1E88E5; --lv-m:#1DBA5F; --lv-s:#FFD24D; --lv-c:#7B869C; --on-s:#1B2B55;
  --race-bg:#1B2B55; --race-ink:#E8EEF9; --race-line:rgba(255,255,255,.22);
  --ok-bg:#E3F6EB; --ok-ink:#117A3C; --warn-bg:#FFF3D6; --warn-ink:#8A5A00; --bad-bg:#FBE4E4; --bad-ink:#9C2A2A; --mute-bg:#EEF2F8; --mute-ink:#5B6679;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1526; --panel:#172038; --ink:#E8EEF9; --ink2:#B4C0D8; --ink3:#8794AE;
    --line:#27334F; --soft:#1F2B49; --blue:#4DA3F0; --blue-d:#7DBBF5; --navy:#2A3B6E;
    --race-bg:#121B33;
    --ok-bg:#12372A; --ok-ink:#6EE0A0; --warn-bg:#3B3115; --warn-ink:#F2CC6B; --bad-bg:#40191C; --bad-ink:#F29A9A; --mute-bg:#212C47; --mute-ink:#A3AEC6;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1526; --panel:#172038; --ink:#E8EEF9; --ink2:#B4C0D8; --ink3:#8794AE;
  --line:#27334F; --soft:#1F2B49; --blue:#4DA3F0; --blue-d:#7DBBF5; --navy:#2A3B6E;
  --race-bg:#121B33;
  --ok-bg:#12372A; --ok-ink:#6EE0A0; --warn-bg:#3B3115; --warn-ink:#F2CC6B; --bad-bg:#40191C; --bad-ink:#F29A9A; --mute-bg:#212C47; --mute-ink:#A3AEC6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 56px}
header.top{padding:22px 0 10px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
header.top h1{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--ink2)}
.sync{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--mute-bg);color:var(--mute-ink)}
.sync.ok{background:var(--ok-bg);color:var(--ok-ink)}
.sync.warn{background:var(--warn-bg);color:var(--warn-ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -20px 22px;padding:0 20px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 10px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--blue-d);border-bottom-color:var(--blue)}
nav.tabs button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h2{font-size:17px;font-weight:500;margin:0 0 12px}
h3{font-size:14.5px;font-weight:500;margin:0 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px}
.lead{color:var(--ink2);margin:0 0 14px;max-width:70ch}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--ink3);font-size:12.5px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:500;border-top:2px solid var(--line);border-bottom:0}
.muted{color:var(--ink3)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--mute-bg);color:var(--mute-ink);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.bad{background:var(--bad-bg);color:var(--bad-ink)}
.lvdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.lv-Junior{background:var(--lv-j)}.lv-Middle{background:var(--lv-m)}.lv-Senior{background:var(--lv-s)}.lv-CD{background:var(--lv-c)}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink3)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px;color:var(--ink);width:100%}
input[type=checkbox]{width:18px;min-height:0;height:18px;padding:0;accent-color:var(--blue)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.grid-form .wide{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 14px;min-height:38px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn.danger{color:var(--red)}
.btn.danger.confirm{background:var(--red);color:#fff;border-color:var(--red)}
.hint{margin-top:10px;min-height:20px;color:var(--ink2);font-size:13px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar>i.full{background:var(--amber)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft);margin:6px 0 10px}
.stack>i{display:block;height:100%}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.ro input,.ro select,.ro button.btn{pointer-events:none;opacity:.6}
/* đường đua */
.race{background:var(--race-bg);color:var(--race-ink);border-radius:12px;padding:20px 22px 12px;margin-bottom:22px}
.race h2{color:#fff;margin-bottom:4px}
.race .sub{color:rgba(232,238,249,.75);margin:0 0 14px}
.lane{display:grid;grid-template-columns:116px minmax(560px,1fr);gap:0 14px;border-top:1px solid var(--race-line);padding:6px 0}
.lane-h{padding-top:44px;font-weight:500}
.lane-h small{display:block;font-weight:400;color:rgba(232,238,249,.7)}
.track{position:relative;margin:0 48px 0 0}
.axis{position:absolute;left:0;right:0;top:50px;border-top:2px dashed var(--race-line)}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--race-line);transform:translateX(-.5px)}
.tick .tl{position:absolute;top:2px;left:0;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:12.5px;font-weight:500}
.tick .tl small{display:block;font-weight:400;color:rgba(232,238,249,.7);font-size:11.5px}
.tick.hit .tl{color:var(--gold)}
.tick.hit{border-left-color:rgba(255,210,77,.55)}
.tick.fin{border-left:2px dashed var(--gold)}
.tick.fin::before{content:"";position:absolute;top:-2px;left:0;width:16px;height:11px;background:var(--gold);clip-path:polygon(0 0,100% 50%,0 100%)}
.runner{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:62px;cursor:default}
.runner>b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;border:2px solid var(--race-bg);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.runner b.lv-Junior{background:var(--lv-j)}.runner b.lv-Middle{background:var(--lv-m)}.runner b.lv-Senior{background:var(--lv-s);color:var(--on-s)}
.runner span{font-size:11.5px;margin-top:2px;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race .scroll{margin:0 -4px;padding:0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.m-on{background:var(--ok-bg);color:var(--ok-ink)}
.chip.m-off{background:var(--mute-bg);color:var(--mute-ink)}
.msrow{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:8px;align-items:center;margin-bottom:8px;max-width:620px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw;box-shadow:0 4px 18px rgba(0,0,0,.25)}
@media (max-width:640px){
  .wrap{padding:0 14px 48px}
  nav.tabs{margin:0 -14px 18px;padding:0 14px}
  .panel{padding:14px}
}
@media (prefers-reduced-motion:no-preference){ .bar>i{transition:width .3s ease} }

.runner{outline-offset:4px}
.runner em{font-style:normal;font-size:11px;color:rgba(232,238,249,.75);line-height:1.2}
.runner:hover,.runner:focus{z-index:9}
.runner .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);width:210px;background:#0E1830;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;text-align:left;font-weight:400;z-index:10}
.runner:hover .tip,.runner:focus .tip{display:block}
.runner.rt .tip{left:auto;right:-14px;transform:none}
.runner.lt .tip{left:-14px;transform:none}
.empty-lane{position:absolute;left:0;right:0;top:14px;color:rgba(232,238,249,.7);font-size:13px}

.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.on{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.banner .btn{margin-left:8px}
button:disabled,.btn:disabled{opacity:.5;cursor:not-allowed}
input:disabled,select:disabled{opacity:.75;background:var(--mute-bg);cursor:not-allowed}
.who{display:inline-flex;align-items:center;gap:8px}
.face{display:inline-block;border-radius:50%;background-size:cover;background-position:center;flex:none;box-shadow:0 0 0 1px var(--line)}
.face.ini{display:inline-grid;place-items:center;color:#fff;font-weight:700}
.face.ini.lv-Senior{color:var(--on-s)}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink2)}
label.photo{cursor:pointer;display:inline-flex;flex-direction:row;color:var(--ink2)}
label.photo.off{opacity:.5}
.runner>b{width:46px;height:46px;border:3px solid var(--ring,#fff);box-shadow:0 0 0 2px var(--race-bg)}
.runner>b.lv-Junior{--ring:var(--lv-j)}.runner>b.lv-Middle{--ring:var(--lv-m)}.runner>b.lv-Senior{--ring:var(--lv-s)}
.runner>b.img{background-size:cover;background-position:center;color:transparent}
.runner .tip strong{font-weight:700}
#modal{position:fixed;inset:0;background:rgba(10,18,40,.55);display:grid;place-items:center;z-index:30;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border-radius:12px;padding:22px;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mbox h2{margin-bottom:10px}
.mbtns{margin-top:16px;justify-content:flex-end}
</style>
</head>

  <header class="top">
    <div>
      <h1>Theo dõi thưởng quý 4.2026</h1>
      <p>Phòng kinh doanh Be.E · nhập deal, theo dõi tiến độ và quỹ thưởng theo chính sách</p>

    <div class="actions">

  <main id="app"></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="modal" hidden></div>

const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function merge(base,src){
  if(!isObj(base)||!isObj(src))return src===undefined?base:src;
  const out={...base};
  for(const key in src){ out[key]=isObj(base[key])&&isObj(src[key])?merge(base[key],src[key]):src[key]; }
  return out;
}
function fixCfg(c){
  const D=defaults();
  c.params.ct5.ms=c.params.ct5.ms||{};
  RACE.forEach(l=>{if(!Array.isArray(c.params.ct5.ms[l]))c.params.ct5.ms[l]=[];});
  if(!c.v||c.v<2){c.params.ct1.cap=D.params.ct1.cap;c.params.ct2.cap=D.params.ct2.cap;c.v=2;}
  c.members.forEach(m=>{
    const d=D.members.find(x=>x.id===m.id);
    if(m.goal==null)m.goal=d?d.goal:0;
    if(m.lvNo==null)m.lvNo=d?d.lvNo:'';
  });
  c.paid=c.paid||{gk:{},ct5:{}};c.paid.gk=c.paid.gk||{};c.paid.ct5=c.paid.ct5||{};
  if(typeof c.adminHash!=='string')c.adminHash='';
  return c;
}

  c[p[p.length-1]]=val;
}

function mergeStates(a,b){
  const out={cfg:a.cfg,cfgAt:a.cfgAt||0,deals:[],del:{...(a.del||{})}};
  if((b.cfgAt||0)>(a.cfgAt||0)){out.cfg=b.cfg;out.cfgAt=b.cfgAt;}
  for(const k in (b.del||{}))out.del[k]=Math.max(out.del[k]||0,b.del[k]);
  const map=new Map();
  [...(a.deals||[]),...(b.deals||[])].forEach(d=>{const o=map.get(d.id);if(!o||(d.upd||d.ts||0)>(o.upd||o.ts||0))map.set(d.id,d);});
  map.forEach(d=>{if((out.del[d.id]||0)>=(d.upd||d.ts||0))return;out.deals.push(d);});
  return out;
}

async function hashPw(pw){
  const txt='be-e-q4|'+pw;
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h.toString(16);
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';}
function modal({title,body,buttons}){
  const m=$('#modal');
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="mbody">${body}</div><div class="row mbtns"></div></div>`;
  const bt=$('.mbtns',m);
  buttons.forEach(b=>{
    const el=document.createElement('button');
    el.className='btn '+(b.cls||'');el.textContent=b.label;if(b.disabled)el.disabled=true;
    el.addEventListener('click',async()=>{const keep=b.on?await b.on(m):undefined;if(keep!==false)closeModal();});
    bt.appendChild(el);
  });
  m.hidden=false;
  const f=$('input',m);if(f)f.focus();
  m.onkeydown=ev=>{
    if(ev.key==='Escape')closeModal();
    if(ev.key==='Enter'&&ev.target.tagName==='INPUT'){const p=$('.mbtns .btn.primary',m);if(p)p.click();}
  };
}

      buttons:[{label:'Đặt mật khẩu và mở khóa',cls:'primary',on:async()=>{

      }},{label:'Hủy'}]});

  }
  modal({title:'Mở khóa chỉnh sửa',
    body:`<label>Mật khẩu<input type="password" id="pw1" autocomplete="current-password"></label><div class="hint" id="pwErr" role="alert"></div>`,

    }},{label:'Hủy'}]});

/* ============ tính toán ============ */
function compute(){
  const P=cfg.params, months=qMonths();
  const mem=Object.fromEntries(cfg.members.map(m=>[m.id,m]));
  const ds=deals.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
  const R={deal:{},used:{CT1:0,CT2:0},rev:{},sum:{CT1:0,CT2:0,CT1p:0,CT2p:0},byMem:{}};
  cfg.members.forEach(m=>{R.rev[m.id]={};months.forEach(mk=>R.rev[m.id][mk]=0);R.byMem[m.id]={CT1:0,CT2:0,CT4:0,CT5:0};});
  for(const d of ds){
    const mk=(d.date||'').slice(0,7), m=mem[d.bc], inQ=months.includes(mk), v=rv(d);
    const info={prog:null,bonus:0,granted:0,state:'none'};
    if(!m){info.state='nomember';}
    else if(!inQ){info.state='out';}
    else{
      R.rev[m.id][mk]+=v;
      if(isBC(m)){
        if(d.type==='Saleshunt'){
          if(v>=P.ct1.min){info.prog='CT1';info.bonus=v>=P.ct2.min?P.ct1.both:P.ct1.bonus;} else info.state='below';
        }else if(d.type==='Newsales'){
          if(v>=P.ct2.min){info.prog='CT2';info.bonus=P.ct2.bonus;} else info.state='below';
        }
        if(info.prog){
          const cap=info.prog==='CT1'?P.ct1.cap:P.ct2.cap;
          const left=Math.max(0,cap-R.used[info.prog]);
          info.granted=Math.min(info.bonus,left);
          R.used[info.prog]+=info.granted;
          info.state=info.granted===0?'cap':(info.granted<info.bonus?'partial':'ok');
          R.sum[info.prog]+=info.granted;
          if(d.paid)R.sum[info.prog+'p']+=info.granted;
          R.byMem[m.id][info.prog]+=info.granted;
        }
      }
    }
    R.deal[d.id]=info;
  }
  let run=0;R.gk=[];
  cfg.members.filter(isBC).forEach(m=>{
    const goal=+m.goal||0;
    const ms=months.map(mk=>({mk,rev:R.rev[m.id][mk],ok:goal>0&&R.rev[m.id][mk]>=goal}));
    const cnt=ms.filter(x=>x.ok).length;
    const want=cnt>=3?P.ct4.b3:(cnt===2?P.ct4.b2:0);
    const got=Math.min(want,Math.max(0,P.ct4.cap-run));run+=got;
    R.gk.push({m,goal,ms,cnt,want,got});
    R.byMem[m.id].CT4=got;
  });
  R.gkTotal=run;
  R.gkPaid=R.gk.reduce((s,x)=>s+(cfg.paid.gk[x.m.id]?x.got:0),0);
  const evA=[],evC=[];R.ms={};
  cfg.members.forEach(m=>{
    const ms=((P.ct5.ms[m.level]||[])).slice().sort((a,b)=>a.at-b.at);
    let cum=0,reached=0,prevB=0;const hit=[];
    for(const d of ds){
      if(d.bc!==m.id||!months.includes((d.date||'').slice(0,7)))continue;
      cum+=rv(d);
      while(reached<ms.length&&cum>=ms[reached].at){
        hit[reached]=d.date;
        (m.level==='CD'?evC:evA).push({id:m.id,idx:reached,date:d.date,ts:d.ts||0,inc:ms[reached].bonus-prevB});
        prevB=ms[reached].bonus;reached++;
      }
    }
    R.ms[m.id]={m,ms,rev:cum,reached,hit,full:prevB,got:0};
  });
  const alloc=(ev,cap)=>{
    ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts-b.ts)||(a.idx-b.idx));
    let r=0;for(const e of ev){const g=Math.min(e.inc,Math.max(0,cap-r));r+=g;R.ms[e.id].got+=g;}
    return r;
  };
  R.ct5Total=alloc(evA,P.ct5.cap);
  R.cdTotal=alloc(evC,P.cd.cap);
  const paidSum=cd=>Object.values(R.ms).filter(x=>(x.m.level==='CD')===cd).reduce((s,x)=>s+(cfg.paid.ct5[x.m.id]?x.got:0),0);
  R.ct5Paid=paidSum(false);R.cdPaid=paidSum(true);
  Object.values(R.ms).forEach(x=>{R.byMem[x.m.id].CT5=x.got;});
  return R;
}

/* ---- Đường đua (CT5 và CD) ---- */
function posOf(ms,rev){
  const n=ms.length;if(!n)return 0;
  let prev=0,px=0;
  for(let i=0;i<n;i++){
    const x=(i+1)/n;
    if(rev<=ms[i].at)return px+(x-px)*(ms[i].at>prev?(rev-prev)/(ms[i].at-prev):0);
    prev=ms[i].at;px=x;
  }
  return 1;
}
function lane(lv,R){
  const ms=(cfg.params.ct5.ms[lv]||[]).slice().sort((a,b)=>a.at-b.at), n=ms.length;
  const people=cfg.members.filter(m=>m.level===lv).map(m=>({m,x:posOf(ms,(R.ms[m.id]||{rev:0}).rev),r:R.ms[m.id]||{rev:0,reached:0,got:0}})).sort((a,b)=>a.x-b.x);
  const rowsLast=[];
  people.forEach(p=>{let r=0;while(rowsLast[r]!==undefined&&p.x-rowsLast[r]<0.085)r++;rowsLast[r]=p.x;p.row=r;});
  const rows=Math.max(1,rowsLast.length);
  const leader=people.reduce((a,p)=>Math.max(a,p.r.reached||0),0);
  const ticks=ms.map((x,i)=>`<div class="tick ${i===n-1?'fin':''} ${i<leader?'hit':''}" style="left:${(i+1)/n*100}%"><div class="tl">${short(x.at)}<small>+${kk(x.bonus)}</small></div></div>`).join('');
  const runners=people.map(p=>{
    const next=ms[p.r.reached];
    const tip=`<div class="tip"><strong>${esc(p.m.name)}</strong><br>Doanh thu hiện tại: ${vnd(p.r.rev)}<br>Đã đạt ${p.r.reached}/${n} mốc, thưởng ${vnd(p.r.got)}<br>${next?'Còn '+vnd(next.at-p.r.rev)+' đến mốc '+short(next.at):(n?'Đã về đích':'Chưa có mốc')}</div>`;
    const side=p.x>0.7?'rt':(p.x<0.15?'lt':'');
    const a=avOf(p.m);
    const disc=a?`<b class="lv-${lv} img" style="background-image:url('${a}')"></b>`:`<b class="lv-${lv}">${esc(p.m.name.charAt(0).toUpperCase())}</b>`;
    return `<div class="runner ${side}" tabindex="0" style="left:${p.x*100}%;top:${62+p.row*62}px">${disc}<span>${esc(p.m.name)}</span><em>${short(p.r.rev)}</em>${tip}</div>`;
  }).join('');

/* ============ ảnh đại diện ============ */
function readAvatar(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=112;
        c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,112,112);
        res(c.toDataURL('image/jpeg',.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.matches('[data-form]')&&ui.form){
    ui.form[t.dataset.form]=t.hasAttribute('data-money')?num(t.value):t.value;
    const h=$('#dealHint');if(h)h.textContent=previewHint();
    return;
  }
  if(t.id==='fMonth'){ui.fm=t.value;render();return;}
  if(t.id==='nmAv'){ui.newAv=t.files[0]?await readAvatar(t.files[0]).catch(()=>''):'';return;}
  if(!isAdmin)return;
  if(t.dataset.avatar){
    const m=cfg.members.find(x=>x.id===t.dataset.avatar);
    if(m&&t.files[0]){try{m.avatar=await readAvatar(t.files[0]);touchCfg();render();}catch(err){toast('Không đọc được ảnh này.');}}
    return;
  }
  if(t.dataset.paid){const d=deals.find(x=>x.id===t.dataset.paid);if(d){d.paid=t.value==='1';touchDeal(d);render();}return;}
  if(t.dataset.paidgk){cfg.paid.gk[t.dataset.paidgk]=t.checked;touchCfg();render();return;}
  if(t.dataset.paid5){cfg.paid.ct5[t.dataset.paid5]=t.checked;touchCfg();render();return;}
  if(t.dataset.path){
    const ty=t.dataset.type;
    let v=ty==='money'?num(t.value):t.value;
    if(t.dataset.path.endsWith('.name'))v=String(v).trim()||'Chưa đặt tên';
    setPath(cfg,t.dataset.path,v);
    if(/params\.ct5\.ms\./.test(t.dataset.path)){const lv=t.dataset.path.split('.')[3];cfg.params.ct5.ms[lv].sort((a,b)=>a.at-b.at);}
    touchCfg();render();
  }
});
document.addEventListener('click',e=>{
  const lab=e.target.closest('label.photo');
  if(lab&&!isAdmin){e.preventDefault();unlockFlow();return;}
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){ui.tab=b.dataset.v;ui.confirm=null;render();window.scrollTo(0,0);return;}
  if(a==='unlock'){unlockFlow();return;}
  if(a==='export'){exportData();return;}
  if(a==='import'){$('#fileIn').click();return;}
  if(a==='changePw'){if(needAdmin())changePwFlow();return;}
  if(a==='saveDeal')return doSaveDeal();
  if(a==='cancelEdit'){ui.editId=null;resetForm();render();return;}
  if(a==='editDeal'){
    const d=deals.find(x=>x.id===b.dataset.id);if(!d)return;
    ui.editId=d.id;ui.form={date:d.date,bc:d.bc,customer:d.customer||'',type:d.type,revenue:rv(d),note:d.note||''};
    render();window.scrollTo(0,0);return;
  }
  if(a==='delDeal'){
    if(ui.confirm===b.dataset.id){ui.confirm=null;dropDeal(b.dataset.id);if(ui.editId===b.dataset.id){ui.editId=null;resetForm();}render();}
    else{ui.confirm=b.dataset.id;render();setTimeout(()=>{if(ui.confirm===b.dataset.id){ui.confirm=null;render();}},3500);}
    return;
  }
  if(!needAdmin())return;
  if(a==='addMember'){
    const name=($('#nmName').value||'').trim();
    if(!name){toast('Nhập tên nhân sự trước khi thêm.');return;}
    const m={id:uid(),name,level:$('#nmLevel').value,lvNo:($('#nmLv').value||'').trim(),goal:num($('#nmGoal').value)};
    if(ui.newAv)m.avatar=ui.newAv;
    ui.newAv='';cfg.members.push(m);touchCfg();render();toast('Đã thêm '+name);return;
  }
  if(a==='delMember'){
    const i=+b.dataset.i,m=cfg.members[i];if(!m)return;
    if(deals.some(d=>d.bc===m.id)){toast('Nhân sự này đã có khoản thực thu nên không xóa được.');return;}
    if(ui.confirm==='m'+m.id){ui.confirm=null;cfg.members.splice(i,1);touchCfg();render();}
    else{ui.confirm='m'+m.id;render();setTimeout(()=>{if(ui.confirm==='m'+m.id){ui.confirm=null;render();}},3500);}
    return;
  }
  if(a==='addMs'){const l=cfg.params.ct5.ms[b.dataset.lv];const last=l[l.length-1];l.push({at:last?last.at+5e8:3e8,bonus:last?last.bonus:0});touchCfg();render();return;}
  if(a==='delMs'){cfg.params.ct5.ms[b.dataset.lv].splice(+b.dataset.i,1);touchCfg();render();return;}
  if(a==='resetParams'){
    if(ui.confirm==='reset'){ui.confirm=null;cfg.params=defaults().params;touchCfg();render();toast('Đã khôi phục tham số mặc định.');}
    else{ui.confirm='reset';render();setTimeout(()=>{if(ui.confirm==='reset'){ui.confirm=null;render();}},3500);}
  }
});
function doSaveDeal(){
  const f=ui.form;
  if(!f.date||!f.bc){toast('Chọn ngày thực thu và BC.');return;}
  if(!(+f.revenue)){toast('Nhập doanh thu thực thu.');return;}
  const rec={id:ui.editId||uid(),ts:Date.now(),date:f.date,bc:f.bc,customer:f.customer.trim(),type:f.type,revenue:+f.revenue||0,note:f.note.trim(),paid:false};
  if(ui.editId){const old=deals.find(x=>x.id===ui.editId);if(old){rec.ts=old.ts||rec.ts;rec.paid=!!old.paid;delete old.value;Object.assign(old,rec);touchDeal(old);}}
  else{deals.push(rec);touchDeal(rec);}
  const keepDate=f.date,keepBc=f.bc;
  ui.editId=null;resetForm();ui.form.date=keepDate;ui.form.bc=keepBc;
  render();toast('Đã lưu.');
}

async function init(){
  $('#bExport').addEventListener('click',exportData);

  $('#bLock').addEventListener('click',()=>{if(isAdmin){setAdmin(false);toast('Đã khóa chỉnh sửa.');}else unlockFlow();});
  $('#fileIn').addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const j=JSON.parse(await f.text());if(!j||j.app!==APP)throw new Error('x');importFlow(j);}
    catch(err){toast('File không đúng định dạng dữ liệu của trang này.');}
  });
  const local=loadLocal();
  if(local)applyState(local);
  resetForm();render();
  /* dữ liệu chung do My đưa lên cùng thư mục (data.json) */
  try{
    const r=await fetch('data.json',{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      if(j&&j.app===APP){
        applyState(local?mergeStates(snap(),j):j);
        fromFile=j.exportedAt?new Date(j.exportedAt).toLocaleDateString('vi-VN'):'';
        persist();resetForm();render();
      }
    }
  }catch(e){}
}
init();
})();

</script>
